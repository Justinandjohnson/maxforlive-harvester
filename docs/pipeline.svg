<svg xmlns='http://www.w3.org/2000/svg' width='1040' height='214' viewBox='0 0 1040 214' role='img' aria-label='The harvest loop an agent follows'>
<rect width='1040' height='214' fill='#ffffff'/>
<text x='20' y='28' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='600' fill='#1f2328'>What your agent does</text>
<rect x='20' y='46' width='150' height='62' rx='8' fill='#ddf4ff' stroke='#54aeff' stroke-width='1.5'/>
<text x='95' y='72' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#1f2328'>1. list</text>
<text x='95' y='91' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#57606a'>newest first</text>
<rect x='190' y='46' width='150' height='62' rx='8' fill='#ddf4ff' stroke='#54aeff' stroke-width='1.5'/>
<text x='265' y='72' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#1f2328'>2. diff</text>
<text x='265' y='91' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#57606a'>skip what you own</text>
<rect x='360' y='46' width='150' height='62' rx='8' fill='#fff8c5' stroke='#d4a72c' stroke-width='1.5'/>
<text x='435' y='72' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#1f2328'>3. download</text>
<text x='435' y='91' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#57606a'>paced, 2-3 s</text>
<rect x='530' y='46' width='150' height='62' rx='8' fill='#dafbe1' stroke='#4ac26b' stroke-width='1.5'/>
<text x='605' y='72' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#1f2328'>4. verify</text>
<text x='605' y='91' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#57606a'>ampf / PK magic</text>
<rect x='700' y='46' width='150' height='62' rx='8' fill='#dafbe1' stroke='#4ac26b' stroke-width='1.5'/>
<text x='775' y='72' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#1f2328'>5. install</text>
<text x='775' y='91' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#57606a'>your User Library</text>
<rect x='870' y='46' width='150' height='62' rx='8' fill='#dafbe1' stroke='#4ac26b' stroke-width='1.5'/>
<text x='945' y='72' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='#1f2328'>6. confirm</text>
<text x='945' y='91' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#57606a'>Live indexes it</text>
<line x1='174' y1='77' x2='184' y2='77' stroke='#57606a' stroke-width='1.5'/>
<polygon points='184,77 177,73 177,81' fill='#57606a'/>
<line x1='344' y1='77' x2='354' y2='77' stroke='#57606a' stroke-width='1.5'/>
<polygon points='354,77 347,73 347,81' fill='#57606a'/>
<line x1='514' y1='77' x2='524' y2='77' stroke='#57606a' stroke-width='1.5'/>
<polygon points='524,77 517,73 517,81' fill='#57606a'/>
<line x1='684' y1='77' x2='694' y2='77' stroke='#57606a' stroke-width='1.5'/>
<polygon points='694,77 687,73 687,81' fill='#57606a'/>
<line x1='854' y1='77' x2='864' y2='77' stroke='#57606a' stroke-width='1.5'/>
<polygon points='864,77 857,73 857,81' fill='#57606a'/>
<rect x='360' y='126' width='330' height='48' rx='6' fill='#fff8c5' stroke='#d4a72c' stroke-dasharray='4 3'/>
<text x='376' y='145' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#1f2328'>Roughly 20 fast requests and the site returns</text>
<text x='376' y='162' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#1f2328'>'error code: 1015' - then everything looks missing.</text>
<text x='20' y='200' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#57606a'>Nothing is installed until its first bytes are confirmed to be a real device.</text>
</svg>
